name: "Minikube wf"
on:
    push: 
      branches: 
        - develop
    pull_request:
      branches:
        - main
env:
    access_key: ${{vars.AWS_CLIENT_ID}}
    region: ${{vars.REGION}}
    repo: ${{vars.ECR_REPO}}
    client_secret: ${{secrets.AWS_SECRET}}
    ecr_reg: "${{secrets.AWS_ID}}.dkr.ecr.eu-south-2.amazonaws.com"

jobs:
  upload_image:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{env.access_key}}
          password: ${{env.client_secret}}
          registry: ${{env.ecr_reg}}
      - name: "Build and push to ECR"
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: "${{env.ecr_reg}}/actions/backend"
  deploy:
    needs: upload_image
    runs-on: ubuntu-latest
    env:
      ca_crt: 'ca.crt'
      client_key: 'client.key'
      client_crt: 'client.crt'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Create credentials"
        run: |
             echo "${{secrets.CLIENT_CRT}}" > ${{env.client_crt}}
             echo "${{secrets.CLIENT_KEY}}" > ${{env.client_key}}
             echo "${{secrets.CA_CRT}}" >${{env.ca_crt}}
      - name: "Set credentials"
        uses: azure/setup-kubectl@v4
      - name: "Check kubectl"
        run: kubectl version

      
        


